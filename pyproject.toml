[project]
name = "nse-alpha-research"
version = "0.1.0"
description = "NSE cross-sectional alpha research: PIT signals, purged walk-forward CV, Indian cost model, locked OOS"
requires-python = ">=3.11,<3.12"
dependencies = [
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=15",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "mlflow>=2.12",
  "typer>=0.12",
  "pyyaml>=6",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
qr = "qr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
